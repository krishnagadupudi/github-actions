name: 03 - workflow runners

on: push

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: show the runner
        run: |
          echo "Jobs is running on the ubuntu runner"
          echo "Runner OS is: ${{ runner.os }}."
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: show the runner
        run: |
          echo "Jobs is running on the windows runner"
          echo "Runner OS is: ${{ runner.os }}."
